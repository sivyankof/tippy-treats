# iPhone builds. Manual runs only (Actions → iOS → Run workflow), never on a push.
#   simulator  — no signing, no secrets: proves the iOS project compiles.
#   trace      — the internal build with the sound trace on a simulator, the console kept as an
#                artifact (the sound's log, 1 day). trace_mode: cold (cold launches), cycles (one
#                launch, then to the background and back again and again), soundboard (the sound
#                test page plays every track in turn).
#   testflight — signs by hand with the team's distribution certificate and the App Store profile of
#                the app, then uploads the build to TestFlight with the App Store Connect API key.
#                No cloud signing and nothing created in the developer account: the key has the
#                App Manager role, which may upload builds but not cloud-sign.
# Secrets (Settings → Secrets and variables → Actions), entered by the owner, docs/11a-device-build.md:
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8, APPLE_TEAM_ID,
#   APPLE_DIST_CERT_P12 (base64), APPLE_DIST_CERT_PASSWORD, APPLE_PROFILE (base64).
# Optional keys (scripts/native/ci-keys.sh; without one that part runs on Google's sample ad ids or
# on its stub): ADMOB_APP_ID_IOS, ADMOB_REWARDED_ID_IOS, ADMOB_INTERSTITIAL_ID_IOS,
# REVENUECAT_API_KEY_IOS, FIREBASE_IOS_PLIST (base64 of GoogleService-Info.plist).
# Nothing signed is kept as an artifact (the repository is public); the keychain, the key file
# and the archive are removed at the end of the job.
name: iOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'simulator: compile check without signing; testflight: signed build to TestFlight'
        type: choice
        options: [simulator, testflight, trace]
        default: simulator
      internal:
        description: 'Internal build (debug menu in the settings)'
        type: boolean
        default: true
      build_number:
        description: 'Build number (empty: the number of this run)'
        type: string
        required: false
      launches:
        description: 'trace: cold launches (or cycles), and seconds each runs (or stays back)'
        type: string
        default: '12x30'
      trace_mode:
        description: 'trace: what the simulator does'
        type: choice
        options: [cold, cycles, soundboard]
        default: cold

permissions:
  contents: read

# Signed uploads wait for each other; simulator traces run side by side (each its own group).
concurrency:
  group: ios-${{ inputs.target }}${{ inputs.target == 'trace' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

env:
  XCODE_PROJECT: ios/App/App.xcodeproj
  XCODE_SCHEME: App
  BUNDLE_ID: app.tippytreats.game

jobs:
  simulator:
    if: inputs.target == 'simulator'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Web build and sync
        env:
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
          ADMOB_REWARDED_ID_IOS: ${{ secrets.ADMOB_REWARDED_ID_IOS }}
          ADMOB_INTERSTITIAL_ID_IOS: ${{ secrets.ADMOB_INTERSTITIAL_ID_IOS }}
          REVENUECAT_API_KEY_IOS: ${{ secrets.REVENUECAT_API_KEY_IOS }}
          FIREBASE_IOS_PLIST: ${{ secrets.FIREBASE_IOS_PLIST }}
        run: |
          cp .env.example .env
          bash scripts/native/ci-keys.sh ios
          if [ "${{ inputs.internal }}" = "true" ]; then npm run app:sync:internal; else npm run app:sync; fi
      - name: Xcode
        run: xcodebuild -version
      - name: Build for the simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
      - name: Size of the app
        run: du -sh "$RUNNER_TEMP"/derived/Build/Products/Debug-iphonesimulator/App.app

  trace:
    if: inputs.target == 'trace'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Web build with the sound trace, and sync
        env:
          TRACE_MODE: ${{ inputs.trace_mode }}
        run: |
          cp .env.example .env
          if [ "$TRACE_MODE" = "soundboard" ]; then echo "VITE_AUDIO_TRACE=soundboard" >> .env; else echo "VITE_AUDIO_TRACE=1" >> .env; fi
          npm run app:sync:internal
      - name: Build for the simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tail -n 20
      - name: Simulator
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"
          udid="$(xcrun simctl list devices available | grep -m 1 -E 'iPhone [0-9]+ Pro \(' | grep -oE '[0-9A-F-]{36}')"
          echo "Device: $(xcrun simctl list devices | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" "$app"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          mkdir -p trace
      - name: Cycles to the background and back
        if: inputs.trace_mode == 'cycles'
        env:
          LAUNCHES: ${{ inputs.launches }}
        run: |
          count="${LAUNCHES%x*}"; secs="${LAUNCHES#*x}"
          case "$count$secs" in ''|*[!0-9]*) echo "::error::launches must look like 12x10 (cycles x seconds back)"; exit 1;; esac
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" > trace/cycles.log 2>&1 &
          pid=$!
          sleep 20
          for i in $(seq 1 "$count"); do
            echo "cycle $i: to the background"
            xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null
            sleep 5
            echo "cycle $i: back"
            xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null
            sleep "$secs"
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          kill "$pid" 2> /dev/null || true
          wait "$pid" 2> /dev/null || true
          grep -a -F '[audio]' trace/cycles.log | sed 's/.*\[audio\] //' | tail -n 400
      - name: Sound test page
        if: inputs.trace_mode == 'soundboard'
        run: |
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" > trace/soundboard.log 2>&1 &
          pid=$!
          sleep 75
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          kill "$pid" 2> /dev/null || true
          wait "$pid" 2> /dev/null || true
          grep -a -F '[audio]' trace/soundboard.log | sed 's/.*\[audio\] //' | tail -n 200
      - name: Cold launches
        if: inputs.trace_mode == 'cold'
        env:
          LAUNCHES: ${{ inputs.launches }}
        run: |
          count="${LAUNCHES%x*}"; secs="${LAUNCHES#*x}"
          case "$count$secs" in ''|*[!0-9]*) echo "::error::launches must look like 12x30"; exit 1;; esac
          udid="$UDID"
          for i in $(seq 1 "$count"); do
            xcrun simctl launch --console-pty --terminate-running-process "$udid" "$BUNDLE_ID" > "trace/launch-$i.log" 2>&1 &
            pid=$!
            sleep "$secs"
            xcrun simctl terminate "$udid" "$BUNDLE_ID" || true
            kill "$pid" 2> /dev/null || true
            wait "$pid" 2> /dev/null || true
            echo "::group::launch $i"
            grep -a -F '[audio]' "trace/launch-$i.log" | sed 's/.*\[audio\] //' | tail -n 60
            echo "::endgroup::"
          done
      - name: Keep the logs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sound-trace-${{ github.run_number }}
          path: trace/
          retention-days: 1

  testflight:
    if: inputs.target == 'testflight'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KEYCHAIN: ${{ github.workspace }}/../signing.keychain-db
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Check the secrets are there
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          missing=""
          for name in KEY_ID ISSUER_ID KEY_P8 TEAM_ID CERT_P12 CERT_PASSWORD PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (docs/11a-device-build.md, section 1)"; exit 1; fi
      - name: Install
        run: npm ci
      - name: Web build and sync
        env:
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
          ADMOB_REWARDED_ID_IOS: ${{ secrets.ADMOB_REWARDED_ID_IOS }}
          ADMOB_INTERSTITIAL_ID_IOS: ${{ secrets.ADMOB_INTERSTITIAL_ID_IOS }}
          REVENUECAT_API_KEY_IOS: ${{ secrets.REVENUECAT_API_KEY_IOS }}
          FIREBASE_IOS_PLIST: ${{ secrets.FIREBASE_IOS_PLIST }}
        run: |
          cp .env.example .env
          bash scripts/native/ci-keys.sh ios
          if [ "${{ inputs.internal }}" = "true" ]; then npm run app:sync:internal; else npm run app:sync; fi
      - name: Xcode
        run: xcodebuild -version
      - name: Signing certificate and profile
        env:
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -E '"(Apple|iPhone) Distribution' | head -n 1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then echo "::error::No distribution identity in APPLE_DIST_CERT_P12 (wrong file or password)"; exit 1; fi
          echo "::add-mask::$identity"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [ "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]; then echo "::error::APPLE_PROFILE is not a profile of $BUNDLE_ID for this team"; exit 1; fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/profile.plist"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Manual signing for the app target
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only the app target signs: its two build configurations are the ones with automatic
          # signing in the project. Set on the command line instead, the profile would also reach
          # the Swift package targets, which refuse a profile. The runner's copy only; git is untouched.
          sed -i '' "s|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\"; CODE_SIGN_IDENTITY = \"$SIGN_IDENTITY\";|" "$XCODE_PROJECT/project.pbxproj"
          test "$(grep -c 'CODE_SIGN_STYLE = Manual;' "$XCODE_PROJECT/project.pbxproj")" = 2
      - name: Version and build number
        env:
          BUILD_INPUT: ${{ inputs.build_number }}
        run: |
          build="${BUILD_INPUT:-${{ github.run_number }}}"
          case "$build" in ''|*[!0-9]*) echo "::error::Build number must be a whole number"; exit 1;; esac
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          version=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version, build $build"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tail -n 80
      - name: API key file
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          # The secret may hold the .p8 text itself or its base64; the file gets the text.
          if printf '%s' "$KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          else
            printf '%s' "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Manual signing with the certificate and profile above: no cloud signing, which a key
          # with the App Manager role may not use. The key only uploads the build.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 80
      - name: Size of the app
        if: success()
        run: du -sh "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
      - name: Remove the keys, the keychain and the archive
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/export" \
            "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/dist.p12" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
