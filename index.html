<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Tippy Treats</title>
    <!-- Nunito for the boot screen and the game: fetched at once, the title waits for it (src/util/boot/boot-screen.ts). -->
    <link
      rel="preload"
      href="/assets/fonts/nunito-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/nunito-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/assets/fonts/nunito-latin-wght-normal.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/assets/fonts/nunito-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/assets/fonts/nunito-cyrillic-wght-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/assets/fonts/nunito-cyrillic-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
      }
      html,
      body {
        margin: 0;
        background: #2b1d16;
      }

      /* Boot screen (docs/07-ui-screens.md, section 1): the tower or the oven, before the game loads.
         One unit --u fits the 390 x 760 scene into the safe band; walls and floors run to the edges.
         Only transform and opacity move. */
      #boot {
        --ink: #3b2a4a;
        --st: var(--safe-top, env(safe-area-inset-top, 0px));
        --sb: var(--safe-bottom, env(safe-area-inset-bottom, 0px));
        --h: calc(100vh - var(--st) - var(--sb));
        --u: min(calc(100vw / 390), calc(var(--h) / 760));
        position: fixed;
        inset: 0;
        z-index: 9000;
        overflow: hidden;
        background: #2b1d16;
        color: #fff;
        font-family: 'Nunito', sans-serif;
        font-weight: 900;
        -webkit-user-select: none;
        user-select: none;
        transition: opacity 300ms ease-out;
      }
      #boot.out {
        opacity: 0;
        pointer-events: none;
      }
      #boot * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      #boot .v,
      #boot .dark {
        display: none;
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #boot[data-v='tower'] .vA,
      #boot[data-v='oven'] .vB {
        display: block;
      }
      /* The tower comes out of the dark launch splash. */
      #boot[data-v='tower'] .dark {
        display: block;
        background: #2b1d16;
        pointer-events: none;
        animation: bt-undark 0.4s ease-out both;
      }
      @keyframes bt-undark {
        to {
          opacity: 0;
        }
      }
      #boot .stage {
        position: absolute;
        left: 50%;
        top: calc(var(--st) + var(--h) / 2);
        width: calc(var(--u) * 390);
        height: calc(var(--u) * 760);
        transform: translate(-50%, -50%);
      }
      #boot .abs {
        position: absolute;
      }
      #boot .wide {
        position: absolute;
        left: calc(50% - 100vw);
        width: 200vw;
      }
      #boot .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #boot .o {
        text-shadow:
          calc(var(--u) * 2) 0 0 var(--ink),
          calc(var(--u) * -2) 0 0 var(--ink),
          0 calc(var(--u) * 2) 0 var(--ink),
          0 calc(var(--u) * -2) 0 var(--ink),
          calc(var(--u) * 1.5) calc(var(--u) * 1.5) 0 var(--ink),
          calc(var(--u) * -1.5) calc(var(--u) * 1.5) 0 var(--ink),
          calc(var(--u) * 1.5) calc(var(--u) * -1.5) 0 var(--ink),
          calc(var(--u) * -1.5) calc(var(--u) * -1.5) 0 var(--ink),
          0 calc(var(--u) * 3.5) 0 var(--ink);
      }

      /* Title: the letters hop in one by one, once, as soon as the font is there. */
      #boot .title {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: calc(var(--u) * 50);
        line-height: 1;
        white-space: nowrap;
      }
      #boot .title span {
        display: inline-block;
        animation: bt-pop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) both;
        animation-delay: calc(var(--i) * 55ms + 80ms);
      }
      #boot .title .a {
        color: #ff5c8a;
      }
      #boot .title .b {
        color: #ffc93c;
      }
      #boot .title .gap {
        width: calc(var(--u) * 14);
      }
      @keyframes bt-pop {
        0% {
          transform: translateY(calc(var(--u) * 26)) scale(0.2);
          opacity: 0;
        }
        60% {
          transform: translateY(calc(var(--u) * -6)) scale(1.15);
          opacity: 1;
        }
        100% {
          transform: none;
          opacity: 1;
        }
      }

      /* Phrases in the device language, one every 2 s. */
      #boot .phrases {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        height: calc(var(--u) * 30);
      }
      #boot[lang='ru'] .phrases[data-lang='ru'],
      #boot[lang='en'] .phrases[data-lang='en'] {
        display: block;
      }
      #boot .phrases span {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: calc(var(--u) * 19);
        opacity: 0;
        animation: bt-phrase 8s infinite both;
      }
      #boot .phrases span:nth-child(2) {
        animation-delay: 2s;
      }
      #boot .phrases span:nth-child(3) {
        animation-delay: 4s;
      }
      #boot .phrases span:nth-child(4) {
        animation-delay: 6s;
      }
      @keyframes bt-phrase {
        0% {
          opacity: 0;
          transform: translateY(calc(var(--u) * 8));
        }
        4%,
        22% {
          opacity: 1;
          transform: none;
        }
        26%,
        100% {
          opacity: 0;
          transform: translateY(calc(var(--u) * -8));
        }
      }
      #boot:not(.go) .title span,
      #boot:not(.go) .phrases span {
        animation-play-state: paused;
      }

      /* A plain layer: SVG body in the game's manner, face in HTML so it can move. */
      #boot .layer {
        position: absolute;
        width: calc(var(--u) * var(--w));
        height: calc(var(--u) * 46);
        transform: translateX(-50%);
      }
      #boot .layer svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #boot .face {
        position: absolute;
        left: 50%;
        top: calc(var(--u) * 17);
        width: calc(var(--u) * 56);
        height: calc(var(--u) * 24);
        transform: translateX(-50%);
      }
      #boot .eye {
        position: absolute;
        top: 0;
        width: calc(var(--u) * 13);
        height: calc(var(--u) * 13);
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 calc(var(--u) * 1.6) var(--ink);
        animation: bt-blink 3.6s infinite;
        animation-delay: var(--blink, 0s);
      }
      #boot .eye.l {
        left: calc(var(--u) * 7);
      }
      #boot .eye.r {
        right: calc(var(--u) * 7);
      }
      #boot .pupil {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--u) * 6.5);
        height: calc(var(--u) * 6.5);
        margin: calc(var(--u) * -3.25);
        border-radius: 50%;
        background: var(--ink);
      }
      #boot .pupil::after {
        content: '';
        position: absolute;
        left: 15%;
        top: 12%;
        width: 35%;
        height: 35%;
        border-radius: 50%;
        background: #fff;
      }
      #boot .cheek {
        position: absolute;
        top: calc(var(--u) * 12);
        width: calc(var(--u) * 9);
        height: calc(var(--u) * 5);
        border-radius: 50%;
        background: #ff8fb0;
        opacity: 0.75;
      }
      #boot .cheek.l {
        left: calc(var(--u) * -4);
      }
      #boot .cheek.r {
        right: calc(var(--u) * -4);
      }
      #boot .mouth {
        position: absolute;
        left: 50%;
        top: calc(var(--u) * 14);
        width: calc(var(--u) * 11);
        height: calc(var(--u) * 6);
        margin-left: calc(var(--u) * -5.5);
        border: calc(var(--u) * 2.2) solid var(--ink);
        border-top: 0;
        border-radius: 0 0 calc(var(--u) * 8) calc(var(--u) * 8);
      }
      #boot .mouth.oh {
        width: calc(var(--u) * 7);
        height: calc(var(--u) * 8);
        margin-left: calc(var(--u) * -3.5);
        border: 0;
        border-radius: 50%;
        background: var(--ink);
        top: calc(var(--u) * 13);
      }
      #boot .sleep .eye {
        background: transparent;
        box-shadow: none;
        animation: none;
      }
      #boot .sleep .eye::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 45%;
        height: 50%;
        border: calc(var(--u) * 2.2) solid var(--ink);
        border-top: 0;
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
      }
      @keyframes bt-blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      #boot .crumb {
        position: absolute;
        width: calc(var(--u) * 6);
        height: calc(var(--u) * 6);
        border-radius: 40%;
        background: #e9b06a;
        box-shadow: 0 0 0 calc(var(--u) * 1.2) #a8622e;
        opacity: 0;
      }

      /* A: the tower grows in the kitchen. The background stays pale so the tower reads first. */
      #boot .vA {
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 calc(var(--u) * 46),
            rgba(201, 141, 98, 0.18) calc(var(--u) * 46) calc(var(--u) * 48)
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 calc(var(--u) * 58),
            rgba(201, 141, 98, 0.14) calc(var(--u) * 58) calc(var(--u) * 60)
          ),
          linear-gradient(#ffe3c4, #fbd3b0 60%, #f6c09a);
      }
      #boot .vA .bg {
        position: absolute;
        inset: 0;
        opacity: 0.78;
      }
      #boot .vA .window {
        left: 50%;
        top: calc(var(--u) * 186);
        width: calc(var(--u) * 170);
        height: calc(var(--u) * 150);
        transform: translateX(-50%);
        border-radius: calc(var(--u) * 16);
        background: linear-gradient(#bfe6ff, #e9f6ff);
        box-shadow:
          0 0 0 calc(var(--u) * 9) #c98d62,
          0 0 0 calc(var(--u) * 12) #a8622e;
      }
      #boot .vA .window::before,
      #boot .vA .window::after {
        content: '';
        position: absolute;
        background: #c98d62;
      }
      #boot .vA .window::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: calc(var(--u) * 7);
        margin-left: calc(var(--u) * -3.5);
      }
      #boot .vA .window::after {
        left: 0;
        right: 0;
        top: 50%;
        height: calc(var(--u) * 7);
        margin-top: calc(var(--u) * -3.5);
      }
      #boot .vA .awning {
        left: 50%;
        top: calc(var(--u) * 164);
        width: calc(var(--u) * 200);
        height: calc(var(--u) * 34);
        transform: translateX(-50%);
        background: repeating-linear-gradient(
          90deg,
          #ff8fb0 0 calc(var(--u) * 25),
          #fff4e4 calc(var(--u) * 25) calc(var(--u) * 50)
        );
        border-radius: calc(var(--u) * 8) calc(var(--u) * 8) calc(var(--u) * 14) calc(var(--u) * 14);
      }
      #boot .vA .beam {
        left: 50%;
        top: calc(var(--u) * 206);
        width: calc(var(--u) * 260);
        height: calc(var(--u) * 460);
        transform: translateX(-50%);
        background: linear-gradient(rgba(255, 255, 240, 0.55), rgba(255, 255, 240, 0));
        clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
      }
      #boot .vA .shelf {
        top: calc(var(--u) * 360);
        height: calc(var(--u) * 12);
        background: #c98d62;
        box-shadow: 0 calc(var(--u) * 6) 0 rgba(120, 70, 40, 0.25);
      }
      #boot .jar {
        width: calc(var(--u) * 30);
        height: calc(var(--u) * 40);
        border-radius: calc(var(--u) * 8) calc(var(--u) * 8) calc(var(--u) * 6) calc(var(--u) * 6);
      }
      #boot .vA .counter {
        top: calc(var(--u) * 600);
        height: calc(100vh + var(--u) * 200);
        background: linear-gradient(#e8d6c4 0 calc(var(--u) * 14), #b57a52 calc(var(--u) * 14));
      }
      #boot .vA .vignette {
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 0, 0, 0) 55%,
          rgba(110, 50, 30, 0.28)
        );
      }
      #boot .vA .title {
        top: calc(var(--u) * 62);
      }
      #boot .vA .tray {
        left: 50%;
        top: calc(var(--u) * 586);
        width: calc(var(--u) * 280);
        height: calc(var(--u) * 16);
        transform: translateX(-50%);
        border-radius: calc(var(--u) * 8);
        background: linear-gradient(#eef1f6, #c9cfda);
        box-shadow:
          inset 0 0 0 calc(var(--u) * 2.5) #7d8698,
          0 calc(var(--u) * 10) 0 rgba(90, 50, 30, 0.18);
      }
      #boot .vA .sway {
        position: absolute;
        left: 50%;
        top: calc(var(--u) * 586);
        width: 0;
        height: 0;
        transform-origin: 0 0;
        animation: bt-sway 4.8s ease-in-out infinite alternate;
      }
      @keyframes bt-sway {
        from {
          transform: rotate(-1.4deg);
        }
        to {
          transform: rotate(1.4deg);
        }
      }
      #boot .vA .stack {
        position: absolute;
        left: 0;
        bottom: 0;
        transform-origin: 50% 100%;
        animation: bt-settle 2.4s infinite;
      }
      @keyframes bt-settle {
        0%,
        39% {
          transform: scaleY(1);
        }
        43% {
          transform: scaleY(0.965);
        }
        52%,
        100% {
          transform: scaleY(1);
        }
      }
      #boot .vA .faller {
        transform-origin: 50% 100%;
        animation: bt-fall 2.4s infinite;
      }
      @keyframes bt-fall {
        0% {
          transform: translate(-50%, calc(var(--u) * -170));
          opacity: 0;
          animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6);
        }
        10% {
          opacity: 1;
        }
        36% {
          transform: translate(-50%, 0) scale(1, 1);
        }
        41% {
          transform: translate(-50%, 0) scale(1.14, 0.78);
        }
        49% {
          transform: translate(-50%, calc(var(--u) * -8)) scale(0.95, 1.07);
        }
        57%,
        86% {
          transform: translate(-50%, 0) scale(1, 1);
          opacity: 1;
        }
        95% {
          transform: translate(-50%, calc(var(--u) * -10)) scale(1.03);
          opacity: 0;
        }
        100% {
          transform: translate(-50%, calc(var(--u) * -170));
          opacity: 0;
        }
      }
      #boot .vA .faller .mouth.oh {
        animation: bt-oh 2.4s infinite;
      }
      #boot .vA .faller .mouth.sm {
        animation: bt-smile 2.4s infinite;
      }
      @keyframes bt-oh {
        0%,
        38% {
          opacity: 1;
        }
        42%,
        100% {
          opacity: 0;
        }
      }
      @keyframes bt-smile {
        0%,
        38% {
          opacity: 0;
        }
        42%,
        100% {
          opacity: 1;
        }
      }
      #boot .vA .watch .pupil {
        animation: bt-look 2.4s infinite;
      }
      @keyframes bt-look {
        0%,
        34% {
          transform: translate(0, calc(var(--u) * -3));
        }
        40%,
        100% {
          transform: translate(0, calc(var(--u) * 0.5));
        }
      }
      #boot .vA .crumbs {
        position: absolute;
        left: 0;
        bottom: calc(var(--u) * 180);
      }
      #boot .vA .crumb {
        animation: bt-crumb 2.4s infinite;
      }
      @keyframes bt-crumb {
        0%,
        39% {
          opacity: 0;
          transform: translate(0, 0);
        }
        41% {
          opacity: 1;
        }
        58% {
          opacity: 1;
          transform: translate(calc(var(--u) * var(--dx)), calc(var(--u) * var(--dy)));
        }
        70%,
        100% {
          opacity: 0;
          transform: translate(calc(var(--u) * var(--dx) * 1.2), calc(var(--u) * (var(--dy) + 40)));
        }
      }
      #boot .vA .phrases {
        top: calc(var(--u) * 640);
      }

      /* B: the oven warms up at night; steam from its chimney, a floor with a bowl and a flour sack. */
      #boot .vB {
        background:
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0) 0 calc(var(--u) * 58),
            rgba(0, 0, 0, 0.18) calc(var(--u) * 58) calc(var(--u) * 60)
          ),
          linear-gradient(#2b1d16, #3a271d 70%, #2b1d16);
      }
      #boot .vB .glow {
        left: 50%;
        top: calc(var(--u) * 410);
        width: calc(var(--u) * 560);
        height: calc(var(--u) * 560);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 160, 70, 0.4), rgba(255, 140, 60, 0) 62%);
        animation: bt-warm 1.8s ease-in-out infinite alternate;
      }
      @keyframes bt-warm {
        from {
          opacity: 0.7;
        }
        to {
          opacity: 1;
        }
      }
      #boot .vB .shelf {
        top: calc(var(--u) * 250);
        height: calc(var(--u) * 10);
        background: #4a3326;
      }
      #boot .vB .jar {
        width: calc(var(--u) * 28);
        height: calc(var(--u) * 38);
        background: #4b372c;
      }
      #boot .vB .night {
        left: calc(var(--u) * 296);
        top: calc(var(--u) * 150);
        width: calc(var(--u) * 74);
        height: calc(var(--u) * 82);
        border-radius: calc(var(--u) * 12);
        background:
          radial-gradient(circle at 22% 72%, #fff6d8 0 calc(var(--u) * 1.4), transparent 0),
          radial-gradient(circle at 80% 58%, #fff6d8 0 calc(var(--u) * 1.1), transparent 0),
          linear-gradient(#1d2440, #33375a);
        box-shadow:
          0 0 0 calc(var(--u) * 6) #5a3d2c,
          0 0 0 calc(var(--u) * 9) #241811;
      }
      #boot .vB .night::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: calc(var(--u) * 5);
        margin-left: calc(var(--u) * -2.5);
        background: #5a3d2c;
      }
      #boot .vB .moon {
        position: absolute;
        left: calc(var(--u) * 44);
        top: calc(var(--u) * 12);
        width: calc(var(--u) * 20);
        height: calc(var(--u) * 20);
        border-radius: 50%;
        background: #f7e6b5;
        box-shadow: 0 0 calc(var(--u) * 14) rgba(247, 230, 181, 0.45);
      }
      #boot .vB .floor {
        top: calc(var(--u) * 540);
        height: calc(100vh + var(--u) * 240);
        background:
          linear-gradient(
            #6b4a37 0 calc(var(--u) * 6),
            #4a3326 calc(var(--u) * 6) calc(var(--u) * 10),
            transparent calc(var(--u) * 10)
          ),
          repeating-linear-gradient(
            180deg,
            transparent 0 calc(var(--u) * 34),
            rgba(0, 0, 0, 0.25) calc(var(--u) * 34) calc(var(--u) * 36)
          ),
          linear-gradient(#4a3322, #2b1d16 calc(var(--u) * 260));
      }
      #boot .vB .refl {
        left: 50%;
        top: calc(var(--u) * 548);
        width: calc(var(--u) * 320);
        height: calc(var(--u) * 90);
        transform: translateX(-50%);
        border-radius: 50%;

    <script>
      // Dev builds print start-up errors on the screen: a phone shows no console, and a module
      // the browser cannot parse fails before any code of the game runs. Plain script on purpose.
      if ('%MODE%' === 'development') {
        (function () {
          function show(text) {
            var box = document.getElementById('dev-errors');
            if (!box) {
              box = document.createElement('pre');
              box.id = 'dev-errors';
              box.style.cssText =
                'position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:12px;' +
                'max-height:60vh;overflow:auto;white-space:pre-wrap;font:12px/1.4 monospace;' +
                'background:#fff3f3;color:#8a0010;border-bottom:2px solid #c00;';
              (document.body || document.documentElement).appendChild(box);
            }
            box.textContent += text + '\n\n';
          }
          // Capture phase: a script or stylesheet that fails to load reports its error here too.
          window.addEventListener(
            'error',
            function (event) {
              var target = event.target;
              if (target && target !== window && (target.src || target.href)) {
                show('Failed to load: ' + (target.src || target.href));
              }
            },
            true,
          );
          window.addEventListener('error', function (event) {
            var where = event.filename ? ' (' + event.filename + ':' + event.lineno + ')' : '';
            show(
              'Error: ' +
                event.message +
                where +
                (event.error && event.error.stack ? '\n' + event.error.stack : ''),
            );
          });
          window.addEventListener('unhandledrejection', function (event) {
            var reason = event.reason;
            show('Unhandled: ' + (reason && reason.stack ? reason.stack : String(reason)));
          });
          // A start that hangs without an error (say, a promise that never settles) shows up too.
          // The soundboard page has no game, so nothing to wait for there. The report is a box of
          // its own and goes away by itself if the game does start after all.
          var noGame = /[?&]soundboard=1(&|$)/.test(location.search);
          function started() {
            return !!document.querySelector('#app canvas');
          }
          function report(seconds) {
            if (noGame || started()) return;
            var loaded = performance.getEntriesByType('resource');
            var last = loaded.slice(-4).map(function (entry) {
              var kb = Math.round((entry.transferSize || entry.encodedBodySize || 0) / 1024);
              var name = entry.name.replace(location.origin, '');
              return '  ' + name + ' ' + kb + ' KB ' + Math.round(entry.duration) + ' ms';
            });
            var late = document.getElementById('dev-boot-late');
            if (!late) {
              late = document.createElement('pre');
              late.id = 'dev-boot-late';
              late.style.cssText =
                'position:fixed;left:0;right:0;bottom:0;z-index:99999;margin:0;padding:12px;' +
                'max-height:40vh;overflow:auto;white-space:pre-wrap;font:12px/1.4 monospace;' +
                'background:#fff3f3;color:#8a0010;border-top:2px solid #c00;';
              (document.body || document.documentElement).appendChild(late);
              var watch = setInterval(function () {
                if (!started()) return;
                clearInterval(watch);
                if (late.parentNode) late.parentNode.removeChild(late);
              }, 500);
            }
            late.textContent =
              'Build %BUILD_STAMP%\n' +
              'The game did not start within ' +
              seconds +
              ' s. Last stage: ' +
              (window.__bootStage || 'main.ts not running') +
              '. Files loaded: ' +
              loaded.length +
              ', last ones:\n' +
              last.join('\n') +
              '\n' +
              navigator.userAgent;
          }
          // A module that fails to load only fires a bare "error" on its <script> tag; a dynamic
          // import of the same entry rejects with the real reason (which file, what went wrong).
          // It imports the exact address of the tag: after a hot update the dev server adds
          // `?t=...` there, and a bare '/src/main.ts' would be a second module starting a second game.
          window.__showDevError = show;
          document.addEventListener('DOMContentLoaded', function () {
            var entry = document.querySelector('script[type="module"][src*="/src/main.ts"]');
            if (!entry) return;
            var probe = document.createElement('script');
            probe.type = 'module';
            probe.textContent =
              'import(' +
              JSON.stringify(entry.src) +
              ").catch(function (e) { window.__showDevError('Import failed: ' + " +
              "(e && (e.stack || e.message) ? (e.message + '\\n' + (e.stack || '')) : String(e))); });";
            document.head.appendChild(probe);
          });
          setTimeout(function () {
            report(8);
          }, 8000);
          setTimeout(function () {
            report(30);
          }, 30000);
        })();
      }
    </script>
