apply plugin: 'com.android.application'

// Release signing comes from android/keystore.properties, a local file that is never committed
// (storeFile, storeType, storePassword, keyAlias, keyPassword; docs/11a-device-build.md;
// scripts/native/make-upload-key.sh writes it). Without it the
// release build stays unsigned and the debug build uses the usual debug key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The build number (versionCode): -PbuildNumber=N or TIPPY_BUILD_NUMBER, 1 by default.
// Google Play needs a bigger one for every upload.
def buildNumber = (project.findProperty('buildNumber') ?: System.getenv('TIPPY_BUILD_NUMBER') ?: '1') as Integer

// The AdMob app id comes from the git-ignored android/ids.local.properties, which
// scripts/native/native-ids.cjs writes from .env (npm run app:sync); Google's sample app id without it.
def idsFile = rootProject.file('ids.local.properties')
def ids = new Properties()
if (idsFile.exists()) {
    idsFile.withInputStream { ids.load(it) }
}
def admobAppId = ids['admobAppId'] ?: 'ca-app-pub-3940256099942544~3347511713'

// The version the player sees, the same as in the game's settings window: scripts/native/native-ids.cjs
// writes it to ids.local.properties from package.json (scripts/native/app-version.cjs: 1.0.0 -> 1.0).
def appVersion = ids['appVersion']
if (!appVersion) {
    throw new GradleException('No appVersion in android/ids.local.properties: run npm run app:sync first')
}

android {
    namespace = "app.tippytreats.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.tippytreats.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNumber
        versionName appVersion
        manifestPlaceholders = [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storeType keystoreProperties['storeType'] ?: 'pkcs12'
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (docs/11a-device-build.md): google-services.json is git-ignored. With it the Firebase
// settings and the Crashlytics build id go into the app; without it the app runs with the
// analytics and the crash reports off (the game knows it at build time, vite.config.ts).
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.info("google-services.json not found: Firebase stays off in this build")
}
